<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#128C7E"/>
      <stop offset="100%" stop-color="#075E54"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background with rounded corners (Play Store squircle) -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>

  <!-- White Chat Bubble with subtle shadow -->
  <path d="M 180,120 L 332,120 C 370,120 400,150 400,188 L 400,300 C 400,338 370,368 332,368 L 210,368 L 140,416 L 150,365 C 122,353 112,328 112,300 L 112,188 C 112,150 142,120 180,120 Z"
        fill="#FFFFFF"
        filter="url(#shadow)"/>

  <!-- Cast Icon inside bubble in Teal -->
  <!-- Base dot -->
  <circle cx="190" cy="305" r="14" fill="#128C7E"/>

  <!-- Arc 1 -->
  <path d="M 190,265 A 40,40 0 0,1 230,305"
        fill="none"
        stroke="#128C7E"
        stroke-width="14"
        stroke-linecap="round"/>

  <!-- Arc 2 -->
  <path d="M 190,225 A 80,80 0 0,1 270,305"
        fill="none"
        stroke="#128C7E"
        stroke-width="14"
        stroke-linecap="round"/>

  <!-- Arc 3 -->
  <path d="M 190,185 A 120,120 0 0,1 310,305"
        fill="none"
        stroke="#128C7E"
        stroke-width="14"
        stroke-linecap="round"/>
</svg>
